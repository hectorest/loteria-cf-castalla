<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lotería CF Castalla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: banda azul del club arriba, décimo como pieza central, formulario en una columna; panel = lista operativa */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --surface-2:#e9eff8; --ink:#0f1d33; --muted:#56667e; --line:#d6dfec;
  --blue:#0b5cc0; --blue-ink:#ffffff; --navy:#0a2f6e; --band:#0a2f6e; --band-ink:#ffffff; --sky:#cfe0f5;
  --gold:#d4a000; --gold-soft:#fbf1cf; --gold-ink:#6b5000;
  --ok:#1f7a4d; --ok-soft:#dff3e8; --warn:#9a5600; --warn-soft:#fdebd2; --danger:#b42318; --danger-soft:#fde4e1;
  --info-soft:#e2edfb; --focus:#0b5cc0;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1322; --surface:#111d31; --surface-2:#172742; --ink:#e8eef8; --muted:#9eadc4; --line:#25344d;
  --blue:#5c9ef2; --blue-ink:#06162e; --navy:#9cc2f5; --band:#0b2550; --band-ink:#ffffff; --sky:#1b3459;
  --gold:#e8b62a; --gold-soft:#3a2f0d; --gold-ink:#f4d684;
  --ok:#5bd096; --ok-soft:#113524; --warn:#f2aa4c; --warn-soft:#3b2709; --danger:#f2786d; --danger-soft:#3d1512;
  --info-soft:#14284a; --focus:#8bbcf7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1322; --surface:#111d31; --surface-2:#172742; --ink:#e8eef8; --muted:#9eadc4; --line:#25344d;
  --blue:#5c9ef2; --blue-ink:#06162e; --navy:#9cc2f5; --band:#0b2550; --band-ink:#ffffff; --sky:#1b3459;
  --gold:#e8b62a; --gold-soft:#3a2f0d; --gold-ink:#f4d684;
  --ok:#5bd096; --ok-soft:#113524; --warn:#f2aa4c; --warn-soft:#3b2709; --danger:#f2786d; --danger-soft:#3d1512;
  --info-soft:#14284a; --focus:#8bbcf7; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1080px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.pending{background:var(--warn-soft);color:var(--warn);font-weight:600;padding:0 .3em;border-radius:3px}

/* Aviso de prueba */
.demo-bar{background:var(--gold-soft);color:var(--gold-ink);border-bottom:1px solid var(--gold);font-size:14px}
.demo-bar .wrap{padding-block:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.demo-bar strong{letter-spacing:.06em;text-transform:uppercase;font-size:12px}

/* Banda del club */
.band{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.05) 46px 92px);pointer-events:none}
.band .wrap{padding-block:18px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.crest{width:52px;height:64px;flex:none;background:#fff;border-radius:10px;display:grid;place-items:center;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.crest img{max-height:100%;width:auto;display:block}
.band .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:600}
.band h1{font-size:28px;font-weight:700;line-height:1.05}
.band .admin-link{margin-left:auto}

main{padding-block:22px 40px;display:grid;gap:20px}

/* Décimo */
.decimo{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:22px 1fr}
.decimo .stripes{background:repeating-linear-gradient(180deg,var(--blue) 0 14px,var(--surface) 14px 28px)}
.decimo .body{padding:18px 20px;display:grid;gap:14px}
.decimo .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.numero{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,16vw,92px);line-height:.9;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--ink);border:3px solid var(--gold);border-radius:10px;padding:10px 16px 6px;justify-self:start;background:var(--gold-soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 18px}
.fact b{display:block;font-size:15px}
.fact span{font-size:15px}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
.card h2{font-size:26px;font-weight:700}
.steps{display:grid;gap:12px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:800;font-size:20px;width:32px;height:32px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center}
.notice{border-radius:10px;padding:12px 14px;font-size:15px;display:grid;gap:4px}
.notice.info{background:var(--info-soft)}
.notice.warn{background:var(--warn-soft);color:var(--ink)}
.notice.ok{background:var(--ok-soft)}
.notice.danger{background:var(--danger-soft)}

/* Formulario */
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--info-soft)}
.err{color:var(--danger);font-size:14px;font-weight:500}
.invalid{border-color:var(--danger)!important}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;cursor:pointer;font-size:15px}
.chips input{accent-color:var(--blue);width:18px;height:18px;flex:none}
.chips label:has(input:checked){border-color:var(--blue);background:var(--info-soft);font-weight:600}
.stepper{display:flex;align-items:stretch;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;max-width:100%}
.stepper button{width:56px;border:0;background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
.stepper input{width:80px;border:0!important;border-radius:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;box-shadow:none!important;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.privacy-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.privacy-box h3{font-family:var(--f-body);font-size:14px;font-weight:700;padding:10px 12px;background:var(--surface-2)}
.privacy-box dl{margin:0;display:grid;grid-template-columns:minmax(90px,max-content) 1fr}
.privacy-box dt,.privacy-box dd{margin:0;padding:8px 12px;border-top:1px solid var(--line)}
.privacy-box dt{font-weight:600;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:10px;border:1.5px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;font-size:16px}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:8px}
.btn.wa{background:#1f8f4e;color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-weight:600}
.band .linkbtn{color:var(--band-ink);opacity:.85;font-weight:500;font-size:14px}

.ref{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:.08em;color:var(--navy)}
.center{text-align:center;justify-items:center}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,12,25,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal .sheet{background:var(--surface);border-radius:14px;max-width:720px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:12px;font-size:15px}
.modal h2{font-size:28px}
.modal h3{font-family:var(--f-body);font-size:16px;font-weight:700;margin-top:6px}
.modal ul{margin:0;padding-left:20px}

/* Panel */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1 1 220px;min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.row .who{min-width:0}
.row .who b{font-size:16px;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.row .qty{font-family:var(--f-display);font-weight:800;font-size:30px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.row .qty small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
.row .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .actions select{width:auto;min-height:36px;padding:4px 8px;font-size:14px}
.row.anon{opacity:.7}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.st-pendiente{background:var(--warn-soft);color:var(--warn)}
.st-confirmada{background:var(--info-soft);color:var(--blue)}
.st-preparada{background:var(--gold-soft);color:var(--gold-ink)}
.st-entregada{background:var(--ok-soft);color:var(--ok)}
.st-cancelada{background:var(--surface-2);color:var(--muted)}
.st-devuelta{background:var(--danger-soft);color:var(--danger)}
.dup{font-size:13px;color:var(--warn);font-weight:600}
.msgbox{grid-column:1/-1;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
fieldset{border:1px solid var(--line);border-radius:12px;padding:16px;margin:0;display:grid;gap:14px;background:var(--surface)}
legend{font-family:var(--f-display);font-size:22px;font-weight:700;padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.checklist li{display:flex;gap:8px}
.checklist .x{color:var(--warn);font-weight:800}
.checklist .y{color:var(--ok);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:15px}
footer{border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .wrap{padding-block:18px;display:grid;gap:6px}

@media (max-width:480px){
  .band h1{font-size:24px}
  .chips{grid-template-columns:1fr}
  .privacy-box dl{grid-template-columns:1fr}
  .privacy-box dd{border-top:0;padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function(){
"use strict";

/* ===================== Configuración por defecto ===================== */
const DEFAULT_CONFIG = {
  numero: "79047",
  sorteo: "Sorteo Extraordinario de Navidad · 22 de diciembre de 2026",
  maxPorTelefono: 20,
  fechaLimite: "",          // datetime-local
  cierreManual: false,
  recogidaDias: "", recogidaHorario: "", recogidaLugar: "",
  diasGuardado: 5,
  plazoConfirmacion: "",    // días, opcional
  contactoNombre: "", contactoTelefono: "",
  telefonoClub: "",         // número del WhatsApp del club (tarjeta prepago)
  respNombre: "CLUB DE FUTBOL CASTALLA", respCif: "G03519550",
  respDireccion: "Calle Ciudad Deportiva s/n, 03420 Castalla (Alicante)",
  respEmail: "cfcastalla@gmail.com",
  dpdNombre: "SYMTRA CONSULTORES Y FORMACIÓN SLU", dpdEmail: "dpd@solucionlopd.net",
  fechaBorrado: "2027-01-12",
  textosRevisados: false,
  plantilla: "Hola {nombre}, te escribimos del CF Castalla. Confirmamos tu reserva {ref}: {decimos} décimo(s) del número {numero} de la Lotería de Navidad.\n\nRecogida: {recogida}.\nEl pago se hace en efectivo al recoger.\n\nSi no puedes venir esos días, avísanos por aquí y te los guardamos {dias_guardado} días más. Si no se recogen ni nos avisas, los décimos se devolverán a la administración.\n\n¡Gracias por apoyar al club!"
};
const ESTADOS = [
  ["pendiente","Pendiente"],["confirmada","Confirmada"],["preparada","Preparada"],
  ["entregada","Entregada"],["cancelada","Cancelada"],["devuelta","Devuelta a la administración"]
];
const ESTADO_LBL = Object.fromEntries(ESTADOS);
const ACTIVOS = new Set(["pendiente","confirmada","preparada","entregada"]);
const RELACIONES = ["Jugador/a (mayor de edad)","Familiar de jugador/a","Aficionado/a o socio/a","Otro"];

/* Credenciales SOLO de la versión de prueba. En la versión real el acceso lo valida Supabase Auth en el servidor. */
const DEMO_USER = "club", DEMO_PASS = "prueba2026";

/* ===================== Almacenamiento (capa intercambiable) =====================
   Prototipo: localStorage del navegador. En producción esta capa se sustituye por
   llamadas a Supabase: el formulario usa una función del servidor que solo inserta,
   y el panel lee con sesión de administrador (RLS). Las validaciones de límite y
   cierre se repetirán en el servidor. */
const KEY = "cfc-loteria-2026-prueba";
let mem = null;
function load(){
  if (mem) return mem;
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  mem = d && typeof d === "object" ? d : {};
  mem.config = Object.assign({}, DEFAULT_CONFIG, mem.config || {});
  mem.reservas = Array.isArray(mem.reservas) ? mem.reservas : [];
  return mem;
}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} }

const Store = {
  config(){ return load().config; },
  saveConfig(c){ load().config = Object.assign({}, load().config, c); persist(); },
  reservas(){ return load().reservas; },
  totalPorTelefono(telKey){
    return load().reservas.filter(r => r.telKey === telKey && ACTIVOS.has(r.estado)).reduce((s,r)=>s+r.decimos,0);
  },
  crear(input){
    const c = this.config();
    if (!formAbierto(c)) return { error: "cerrado" };
    const n = parseInt(input.decimos,10);
    if (!(n >= 1 && n <= c.maxPorTelefono)) return { error: "cantidad" };
    const ya = this.totalPorTelefono(input.telKey);
    if (ya + n > c.maxPorTelefono) return { error: "limite" };
    const refs = new Set(load().reservas.map(r=>r.ref));
    let ref; do { ref = nuevaRef(); } while (refs.has(ref));
    const now = new Date().toISOString();
    load().reservas.push({
      id: ref, ref, nombre: input.nombre, telefono: input.telefono, telKey: input.telKey,
      relacion: input.relacion, decimos: n, estado: "pendiente",
      mayorEdad: true, privacidadLeida: true, creada: now, actualizada: now
    });
    persist();
    return { ok: true, ref };
  },
  estado(id, estado){
    const r = load().reservas.find(x=>x.id===id); if (!r) return;
    r.estado = estado; r.actualizada = new Date().toISOString(); persist();
  },
  eliminar(id){ load().reservas = load().reservas.filter(x=>x.id!==id); persist(); },
  anonimizarTodo(){
    load().reservas.forEach(r => { r.nombre = null; r.telefono = null; r.telKey = null; r.anon = true; });
    load().borradoEn = new Date().toISOString(); persist();
  },
  borradoEn(){ return load().borradoEn || null; },
  reiniciarPrueba(){ mem = { config: Object.assign({}, load().config), reservas: [] }; persist(); }
};

/* ===================== Utilidades ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const P = (v, txt="pendiente de configurar") => v ? esc(v) : `<span class="pending">${txt}</span>`;
function nuevaRef(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = new Uint8Array(4);
  (window.crypto||{}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_,i)=>b[i]=Math.random()*256|0);
  return "CFC-" + Array.from(b, x => A[x % A.length]).join("");
}
function normTel(raw){
  let t = String(raw||"").replace(/[\s\-().]/g,"");
  if (t.startsWith("00")) t = "+" + t.slice(2);
  if (/^\+34\d{9}$/.test(t)) t = t.slice(3);
  if (/^[6789]\d{8}$/.test(t)) return { ok:true, key:"34"+t, show: t.replace(/(\d{3})(\d{3})(\d{3})/,"$1 $2 $3") };
  if (/^\+\d{8,15}$/.test(t)) return { ok:true, key:t.slice(1), show:t };
  return { ok:false };
}
function fechaLarga(dtLocal){
  if (!dtLocal) return "";
  const d = new Date(dtLocal); if (isNaN(d)) return "";
  return d.toLocaleString("es-ES",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}) + " h";
}
function fechaCorta(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function fechaDia(ymd){
  if (!ymd) return ""; const d = new Date(ymd+"T12:00:00"); if (isNaN(d)) return "";
  return d.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
}
function formAbierto(c){
  if (c.cierreManual) return false;
  if (!c.fechaLimite) return true;
  const d = new Date(c.fechaLimite); return isNaN(d) || Date.now() < d.getTime();
}
function recogidaTexto(c){
  return [c.recogidaDias, c.recogidaHorario, c.recogidaLugar].filter(Boolean).join(" · ");
}
function pendientes(c){
  const p = [];
  p.push(["Conectar la base de datos segura (Supabase). Ahora los datos solo están en este navegador.", false]);
  p.push(["Fecha límite de reserva", !!c.fechaLimite]);
  p.push(["Días, horario y lugar de recogida", !!(c.recogidaDias && c.recogidaHorario && c.recogidaLugar)]);
  p.push(["Persona y teléfono de contacto", !!(c.contactoNombre && c.contactoTelefono)]);
  p.push(["Número de WhatsApp del club", !!c.telefonoClub]);
  p.push(["Datos del responsable y del DPD", !!(c.respNombre && c.respCif && c.respDireccion && c.respEmail && c.dpdNombre && c.dpdEmail)]);
  p.push(["Textos legales revisados por la asesoría", !!c.textosRevisados]);
  return p;
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
async function copiar(texto, btn){
  try { await navigator.clipboard.writeText(texto); toast("Mensaje copiado"); }
  catch(e){
    const box = btn && btn.closest(".row") && btn.closest(".row").querySelector(".msgbox");
    if (box){ const r=document.createRange(); r.selectNodeContents(box); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Selecciona el texto y cópialo a mano");
  }
}

/* Borrado automático en la fecha configurada */
(function autoBorrado(){
  const c = Store.config();
  if (!c.fechaBorrado || Store.borradoEn()) return;
  const d = new Date(c.fechaBorrado+"T00:00:00");
  if (!isNaN(d) && Date.now() >= d.getTime() && Store.reservas().some(r=>!r.anon)) Store.anonimizarTodo();
})();

/* ===================== Vista pública ===================== */
let publicStage = "edad"; // edad | menor | form | hecho
let ultimaRef = null, ultimaCant = 0;

function decimoHTML(c){
  return `<section class="decimo" aria-label="Número de lotería">
    <div class="stripes" aria-hidden="true"></div>
    <div class="body">

function setErr(id, msg, inputId){
  const e = $("#"+id); if (!e) return;
  e.hidden = !msg; e.textContent = msg || "";
  if (inputId){ const i=$("#"+inputId); if (i) i.classList.toggle("invalid", !!msg); }
}

function bindPublic(){
  const c = Store.config();
  $("#btnMayor")?.addEventListener("click", ()=>{ publicStage="form"; renderPublic(); $("#fNombre")?.focus(); });
  $("#btnMenor")?.addEventListener("click", ()=>{ publicStage="menor"; renderPublic(); });
  $("#btnVolver")?.addEventListener("click", ()=>{ publicStage="edad"; renderPublic(); });
  $("#btnOtra")?.addEventListener("click", ()=>{ publicStage="form"; renderPublic(); });
  const cant = $("#fCant");
  if (cant){
    const clamp = v => Math.max(1, Math.min(c.maxPorTelefono, parseInt(v,10)||1));
    $("#menos").onclick = ()=>{ cant.value = clamp(+cant.value-1); };
    $("#mas").onclick = ()=>{ cant.value = clamp(+cant.value+1); };
    cant.addEventListener("change", ()=>{ cant.value = clamp(cant.value); });
  }
  const f = $("#formReserva");
  if (f) f.addEventListener("submit", ev => {
    ev.preventDefault();
    if ($("#fWeb").value) return; // trampa anti-robots
    let ok = true;
    const nombre = $("#fNombre").value.trim().replace(/\s+/g," ");
    if (nombre.length < 5 || !/\s/.test(nombre)){ setErr("eNombre","Escribe tu nombre y al menos un apellido.","fNombre"); ok=false; } else setErr("eNombre","", "fNombre");
    const tel = normTel($("#fTel").value);
    if (!tel.ok){ setErr("eTel","Revisa el teléfono: escribe un móvil español de 9 cifras o un número internacional con +.","fTel"); ok=false; } else setErr("eTel","","fTel");
    const relEl = f.querySelector('input[name="relacion"]:checked');
    if (!relEl){ setErr("eRel","Elige una opción."); ok=false; } else setErr("eRel","");
    const n = parseInt($("#fCant").value,10);
    if (!(n>=1 && n<=c.maxPorTelefono)){ setErr("eCant",`Elige entre 1 y ${c.maxPorTelefono} décimos.`,"fCant"); ok=false; } else setErr("eCant","","fCant");
    if (!$("#fPriv").checked){ setErr("ePriv","Marca la casilla para confirmar que has leído la información de protección de datos."); ok=false; } else setErr("ePriv","");
    if (!ok){ f.querySelector(".err:not([hidden])")?.scrollIntoView({block:"center",behavior:"smooth"}); return; }
    const r = Store.crear({ nombre, telefono: tel.show, telKey: tel.key, relacion: relEl.value, decimos: n });
    if (r.error === "limite"){ setErr("eForm", `Has llegado al máximo de ${c.maxPorTelefono} décimos por persona (se suman todas las reservas hechas con este móvil). Si necesitas más, llama a ${c.contactoNombre || "el club"}${c.contactoTelefono ? " (" + c.contactoTelefono + ")" : ""}.`); return; }
    if (r.error === "cerrado"){ renderPublic(); return; }
    if (r.error){ setErr("eForm","No se ha podido guardar la reserva. Revisa los datos e inténtalo de nuevo."); return; }
    ultimaRef = r.ref; ultimaCant = n; publicStage = "hecho"; renderPublic();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

  <h3>2. Qué datos tratamos</h3>
  <p>Nombre y apellidos, teléfono móvil, relación con el club (jugador/a mayor de edad, familiar, aficionado/a o socio/a, otro), número de décimos, referencia, estado de la reserva y fecha. También que has declarado ser mayor de edad y haber leído esta información. No pedimos DNI, dirección, correo ni datos bancarios.</p>

  <h3>4. Base jurídica</h3>
  <p>El tratamiento es necesario para atender tu solicitud de reserva (artículo 6.1.b del RGPD). Por eso no te pedimos un consentimiento aparte. Si no facilitas nombre y teléfono, no podemos gestionar la reserva.</p>
  <h3>5. Cuánto tiempo los guardamos</h3>
  <p>Hasta el ${esc(fechaDia(c.fechaBorrado)) || P("")}, unas semanas después del sorteo, para poder atender incidencias relacionadas con la reserva o la entrega. Después se borran nombre y teléfono, y solo se conservan totales anónimos. Los mensajes de WhatsApp de confirmación se borrarán del teléfono del club en las mismas fechas.</p>
  <h3>6. Quién puede acceder a ellos</h3>

let sesion = false;
try { sesion = sessionStorage.getItem("cfc-sesion") === "1"; } catch(e){}
let tab = "reservas", filtro = "todas", busqueda = "", abierto = null, confirmando = null;

function renderAdmin(){
  if (!sesion) return renderLogin();
  $("#headerAction").innerHTML = `<button class="linkbtn" id="salir">Cerrar sesión</button>`;
  $("#salir").onclick = ()=>{ sesion=false; try{sessionStorage.removeItem("cfc-sesion");}catch(e){} location.hash=""; };
  const c = Store.config();
  const tabs = [["reservas","Reservas"],["ajustes","Ajustes"],["cierre","Cierre y borrado"]];
  $("#app").innerHTML = `<main class="wrap wide">
    <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}
      <button style="margin-left:auto" data-ver-form>Ver formulario público ↗</button></nav>
    <div id="tabBody" style="display:grid;gap:18px"></div></main>`;
  $("#app").querySelectorAll("[data-tab]").forEach(b => b.onclick = ()=>{ tab=b.dataset.tab; abierto=null; confirmando=null; renderAdmin(); });

function mensajeWA(c, r){
  return c.plantilla
    .replaceAll("{nombre}", (r.nombre||"").split(" ")[0])
    .replaceAll("{ref}", r.ref).replaceAll("{decimos}", r.decimos)
    .replaceAll("{numero}", c.numero)
    .replaceAll("{recogida}", recogidaTexto(c) || "[recogida pendiente de configurar]")
    .replaceAll("{dias_guardado}", c.diasGuardado);
}

function renderReservas(c){
  const all = Store.reservas();
  const activos = all.filter(r=>ACTIVOS.has(r.estado));
  const sum = a => a.reduce((s,r)=>s+r.decimos,0);
  const porTel = {};
  all.forEach(r => { if (r.telKey){ (porTel[r.telKey] ||= []).push(r); } });
  const pend = pendientes(c).filter(p=>!p[1]);
  const q = busqueda.trim().toLowerCase();
  const lista = all.filter(r => (filtro==="todas" || r.estado===filtro) &&
      (!q || (r.nombre||"").toLowerCase().includes(q) || r.ref.toLowerCase().includes(q) || (r.telefono||"").replace(/\s/g,"").includes(q.replace(/\s/g,""))))
    .sort((a,b)=> b.creada.localeCompare(a.creada));

  const body = $("#tabBody");
  body.innerHTML = `
    ${pend.length ? `<div class="notice warn"><b>No usar todavía con datos reales.</b><span>Faltan ${pend.length} requisito(s). Revísalos en <button class="linkbtn" data-goto="cierre">Cierre y borrado</button>.</span></div>` : ""}
    <div class="notice ${formAbierto(c)?"ok":"danger"} small"><b>Formulario ${formAbierto(c)?"abierto":"cerrado"}.</b><span>${c.fechaLimite ? (formAbierto(c)?"Se cierra el ":"Cerró el ")+esc(fechaLarga(c.fechaLimite)) : "Sin fecha límite configurada."}${c.cierreManual?" Cerrado manualmente.":""}</span></div>
    <div class="stats">
      <div class="stat"><div class="k">Décimos reservados</div><div class="v">${sum(activos)}</div></div>
      <div class="stat"><div class="k">Solicitudes activas</div><div class="v">${activos.length}</div></div>
      <div class="stat"><div class="k">Sin confirmar</div><div class="v">${all.filter(r=>r.estado==="pendiente").length}</div></div>
      <div class="stat"><div class="k">Décimos entregados</div><div class="v">${sum(all.filter(r=>r.estado==="entregada"))}</div></div>
    </div>
    <div class="toolbar"><input type="text" id="buscar" placeholder="Buscar por nombre, referencia o teléfono" value="${esc(busqueda)}" aria-label="Buscar"></div>
    <div class="filters" role="group" aria-label="Filtrar por estado">
      ${[["todas","Todas"],...ESTADOS].map(([k,l])=>{
        const n = k==="todas" ? all.length : all.filter(r=>r.estado===k).length;
        return `<button aria-pressed="${filtro===k}" data-filtro="${k}">${esc(l.replace(" a la administración",""))} · ${n}</button>`;}).join("")}
    </div>
    <div class="rows">${lista.length ? lista.map(r => filaHTML(c, r, porTel)).join("") :
      `<div class="card center muted">${all.length ? "No hay reservas con ese filtro." : "Aún no hay reservas. Cuando alguien envíe el formulario aparecerá aquí."}</div>`}</div>`;

  body.querySelector("[data-goto]")?.addEventListener("click", ()=>{ tab="cierre"; renderAdmin(); });
  const b = $("#buscar");
  b.addEventListener("input", ()=>{ busqueda=b.value; const pos=b.selectionStart; renderReservas(c); const nb=$("#buscar"); nb.focus(); nb.setSelectionRange(pos,pos); });
  body.querySelectorAll("[data-filtro]").forEach(x => x.onclick = ()=>{ filtro=x.dataset.filtro; renderReservas(c); });
  body.querySelectorAll("select[data-estado]").forEach(s => s.onchange = ()=>{ Store.estado(s.dataset.estado, s.value); toast("Estado: " + ESTADO_LBL[s.value]); renderReservas(c); });
  body.querySelectorAll("[data-msg]").forEach(x => x.onclick = ()=>{ abierto = abierto===x.dataset.msg ? null : x.dataset.msg; renderReservas(c); });
  body.querySelectorAll("[data-copy]").forEach(x => x.onclick = ()=>{ const r=all.find(y=>y.id===x.dataset.copy); copiar(mensajeWA(c,r), x); });
  body.querySelectorAll("[data-del]").forEach(x => x.onclick = ()=>{ confirmando = x.dataset.del; renderReservas(c); });
  body.querySelectorAll("[data-del-no]").forEach(x => x.onclick = ()=>{ confirmando = null; renderReservas(c); });
  body.querySelectorAll("[data-del-si]").forEach(x => x.onclick = ()=>{ Store.eliminar(x.dataset.delSi); confirmando=null; toast("Reserva eliminada"); renderReservas(c); });
}

function filaHTML(c, r, porTel){
  const grupo = r.telKey ? porTel[r.telKey] : null;
  const dup = grupo && grupo.length > 1
    ? `<div class="dup">${grupo.length} solicitudes con este teléfono · ${grupo.filter(x=>ACTIVOS.has(x.estado)).reduce((s,x)=>s+x.decimos,0)} décimos activos</div>` : "";
  const wa = r.telKey ? `https://wa.me/${encodeURIComponent(r.telKey)}?text=${encodeURIComponent(mensajeWA(c,r))}` : null;
  const sel = `<select data-estado="${esc(r.id)}" aria-label="Estado de ${esc(r.ref)}">${ESTADOS.map(([k,l])=>`<option value="${k}" ${r.estado===k?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  const acciones = confirmando === r.id
    ? `<span class="small"><b>¿Eliminar esta reserva y sus datos?</b> No se puede deshacer.</span>
       <button class="btn sm danger" data-del-si="${esc(r.id)}">Sí, eliminar</button>
       <button class="btn sm ghost" data-del-no>No</button>`
    : `${sel}
       ${wa ? `<a class="btn sm wa" href="${wa}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
       <button class="btn sm ghost" data-msg="${esc(r.id)}" aria-expanded="${abierto===r.id}">${abierto===r.id?"Ocultar mensaje":"Ver mensaje"}</button>` : ""}
       <button class="btn sm ghost" data-del="${esc(r.id)}" style="margin-left:auto">Eliminar</button>`;
  return `<article class="row ${r.anon?"anon":""}">
    <div class="who">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${r.anon ? "<i>Datos personales borrados</i>" : esc(r.nombre)}</b><span class="pill st-${r.estado}">${esc(ESTADO_LBL[r.estado].replace(" a la administración",""))}</span></div>
      <div class="meta"><span class="mono">${esc(r.ref)}</span>${r.telefono?`<span class="mono">${esc(r.telefono)}</span>`:""}<span>${esc(r.relacion)}</span><span>${esc(fechaCorta(r.creada))}</span></div>
      ${dup}
    </div>
    <div class="qty">${r.decimos}<small>décimos</small></div>
    <div class="actions">${acciones}</div>
    ${abierto===r.id && wa ? `<div class="msgbox">${esc(mensajeWA(c,r))}</div><div class="actions"><button class="btn sm ghost" data-copy="${esc(r.id)}">Copiar mensaje</button><span class="small muted">Si el botón de WhatsApp no abre la app, copia el mensaje y envíalo al <span class="mono">${esc(r.telefono)}</span> desde el móvil del club.</span></div>` : ""}
  </article>`;
}

function campo(id, label, val, opts={}){
  const type = opts.type || "text";
  const input = type==="textarea"
    ? `<textarea id="${id}" rows="${opts.rows||6}">${esc(val)}</textarea>`
    : `<input type="${type}" id="${id}" value="${esc(val)}" ${opts.min!=null?`min="${opts.min}"`:""} ${opts.max!=null?`max="${opts.max}"`:""} ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}>`;
  return `<div class="field"><label for="${id}">${label}</label>${input}${opts.hint?`<div class="hint">${opts.hint}</div>`:""}</div>`;
}

function renderAjustes(c){
  $("#tabBody").innerHTML = `<form id="formAjustes" novalidate style="display:grid;gap:18px">
    <fieldset><legend>Campaña</legend><div class="grid2">
      ${campo("aNumero","Número de lotería",c.numero)}
      ${campo("aMax","Máximo de décimos por persona",c.maxPorTelefono,{type:"number",min:1,max:200,hint:"Se suman todas las reservas hechas con el mismo móvil."})}
      ${campo("aLimite","Fecha y hora límite para reservar",c.fechaLimite,{type:"datetime-local",hint:"A esa hora el formulario se cierra solo."})}
      ${campo("aConf","Días para recibir confirmación (opcional)",c.plazoConfirmacion,{type:"number",min:1,max:30,hint:"Si lo rellenas, se dice al público: «si no recibes confirmación en X días, llama a…»"})}
    </div></fieldset>
    <fieldset><legend>Recogida</legend><div class="grid2">
      ${campo("aDias","Días de recogida",c.recogidaDias,{ph:"Ej.: sábado 12 y domingo 13 de diciembre"})}
      ${campo("aHorario","Horario",c.recogidaHorario,{ph:"Ej.: de 10:00 a 13:00"})}
      ${campo("aLugar","Lugar",c.recogidaLugar,{ph:"Ej.: oficina del club"})}
      ${campo("aGuardado","Días que se guardan si avisan",c.diasGuardado,{type:"number",min:0,max:30})}
    </div></fieldset>
    <fieldset><legend>Contacto y WhatsApp</legend><div class="grid2">
      ${campo("aCNombre","Persona de contacto",c.contactoNombre,{hint:"Se muestra al público para pedir más de "+esc(c.maxPorTelefono)+" décimos o si no llega la confirmación."})}
      ${campo("aCTel","Teléfono de contacto (público)",c.contactoTelefono,{type:"tel"})}
      ${campo("aWa","Número de WhatsApp del club",c.telefonoClub,{type:"tel",hint:"El móvil (tarjeta prepago) desde el que se envían las confirmaciones. Solo informativo."})}
    </div>
    ${campo("aPlantilla","Mensaje de confirmación por WhatsApp",c.plantilla,{type:"textarea",rows:8,hint:"Puedes usar {nombre}, {ref}, {decimos}, {numero}, {recogida} y {dias_guardado}."})}
    </fieldset>
    <fieldset><legend>Protección de datos</legend><div class="grid2">
      ${campo("aRNombre","Nombre legal del responsable",c.respNombre)}
      ${campo("aRCif","CIF",c.respCif)}
      ${campo("aRDir","Domicilio",c.respDireccion)}
      ${campo("aREmail","Correo para ejercer derechos",c.respEmail,{type:"text"})}
      ${campo("aDNombre","Delegado de Protección de Datos",c.dpdNombre)}
      ${campo("aDEmail","Correo del DPD",c.dpdEmail)}
      ${campo("aBorrado","Fecha de borrado automático",c.fechaBorrado,{type:"date",hint:"Ese día se borran nombres y teléfonos y solo quedan totales anónimos."})}
    </div>
    <label class="check"><input type="checkbox" id="aRevisado" ${c.textosRevisados?"checked":""}> <span>La asesoría ha revisado la información de privacidad y las condiciones de la campaña.</span></label>
    <button type="button" class="linkbtn" data-open="privacidad" style="justify-self:start">Ver la política de privacidad tal como queda</button>
    </fieldset>
    <div><button class="btn primary" type="submit">Guardar ajustes</button></div>
  </form>`;
  $("#formAjustes").addEventListener("submit", ev => {
    ev.preventDefault();
    const v = id => $("#"+id).value.trim();
    const num = v("aNumero").replace(/\D/g,"");
    Store.saveConfig({
      numero: num || c.numero,
      maxPorTelefono: Math.max(1, parseInt(v("aMax"),10) || 20),
      fechaLimite: v("aLimite"), plazoConfirmacion: v("aConf"),
      recogidaDias: v("aDias"), recogidaHorario: v("aHorario"), recogidaLugar: v("aLugar"),
      diasGuardado: Math.max(0, parseInt(v("aGuardado"),10) || 0),
      contactoNombre: v("aCNombre"), contactoTelefono: v("aCTel"), telefonoClub: v("aWa"),
      plantilla: $("#aPlantilla").value,
      respNombre: v("aRNombre"), respCif: v("aRCif"), respDireccion: v("aRDir"), respEmail: v("aREmail"),
      dpdNombre: v("aDNombre"), dpdEmail: v("aDEmail"), fechaBorrado: v("aBorrado"),
      textosRevisados: $("#aRevisado").checked
    });
    toast("Ajustes guardados");
  });
}

function renderCierre(c){
  const all = Store.reservas();
  const conDatos = all.filter(r=>!r.anon).length;
  const pend = pendientes(c);
  $("#tabBody").innerHTML = `
    <section class="card"><h2>Antes de usarla con datos reales</h2>
      <ul class="checklist">${pend.map(([t,ok])=>`<li><span class="${ok?"y":"x"}">${ok?"✓":"✗"}</span><span>${esc(t)}</span></li>`).join("")}</ul>
    </section>
    <section class="card"><h2>Formulario</h2>
      <p>Estado: <b>${formAbierto(c) ? "abierto" : "cerrado"}</b>. ${c.fechaLimite ? "Fecha límite: " + esc(fechaLarga(c.fechaLimite)) + "." : "Sin fecha límite configurada."}</p>
      <label class="check"><input type="checkbox" id="cManual" ${c.cierreManual?"checked":""}> <span>Cerrar el formulario ahora, aunque no haya llegado la fecha límite.</span></label>
    </section>
    <section class="card"><h2>Borrado de datos personales</h2>
      <p>Borrado automático programado: <b>${c.fechaBorrado ? esc(fechaDia(c.fechaBorrado)) : "sin fecha"}</b>. ${Store.borradoEn() ? "Se borraron los datos el " + esc(fechaCorta(Store.borradoEn())) + "." : ""}</p>
      <p class="muted small">Se borran nombres y teléfonos de todas las reservas. Se conservan solo la referencia, el número de décimos, la relación con el club y el estado, para tener totales sin datos personales.</p>
      <p>Reservas con datos personales ahora: <b>${conDatos}</b>.</p>
      <div class="field"><label for="cConfirm">Para borrar ahora, escribe BORRAR</label><input type="text" id="cConfirm" autocomplete="off" style="max-width:240px"></div>
      <div><button class="btn danger" id="cBorrar" ${conDatos?"":"disabled"}>Borrar todos los datos personales</button></div>
      <div class="notice info small"><b>Después del borrado, recordad también:</b>
        <span>borrar las conversaciones de confirmación en el WhatsApp del móvil del club, y cualquier lista en papel o captura de pantalla que se haya hecho para las entregas.</span></div>
    </section>
    <section class="card"><h2>Solo versión de prueba</h2>
      <p class="small muted">Vacía todas las reservas de prueba guardadas en este navegador. Los ajustes se mantienen.</p>
      <div><button class="btn ghost" id="cReset">Vaciar reservas de prueba</button></div>
    </section>`;
  $("#cManual").onchange = e => { Store.saveConfig({cierreManual: e.target.checked}); toast(e.target.checked ? "Formulario cerrado" : "Formulario reabierto"); renderCierre(Store.config()); };
  $("#cBorrar").onclick = ()=>{
    if ($("#cConfirm").value.trim().toUpperCase() !== "BORRAR"){ toast("Escribe BORRAR para confirmar"); $("#cConfirm").focus(); return; }
    Store.anonimizarTodo(); toast("Datos personales borrados"); renderCierre(Store.config());
  };
  $("#cReset").onclick = ()=>{ Store.reiniciarPrueba(); toast("Reservas de prueba vaciadas"); renderCierre(Store.config()); };
}

/* ===================== Pie y enrutado ===================== */
function renderFooter(){
  const c = Store.config();
  $("#footer").innerHTML = `<span>${P(c.respNombre)} · CIF ${P(c.respCif)} · ${P(c.respDireccion)}</span>
    <span>Décimos oficiales de Loterías y Apuestas del Estado, distribuidos por el club. Prohibida la venta a menores de edad.</span>
    <span><button class="linkbtn" data-open="privacidad">Política de privacidad</button> · <button class="linkbtn" id="accesoClub">Acceso club</button></span>`;
  $("#accesoClub").onclick = ()=>{ location.hash = "panel"; };
}
function render(){
  renderFooter();
  if (location.hash === "#panel") renderAdmin(); else renderPublic();
}
window.addEventListener("hashchange", ()=>{ window.scrollTo(0,0); render(); });
render();
})();
</script>
